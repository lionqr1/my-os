name: Build OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Build Debian live image
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/build \
            debian:stable \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap ca-certificates
              lb config
              lb build
            '

      - name: Generate checksum
        run: |
          cd build
          sha256sum live-image-amd64.hybrid.iso > SHA256SUMS

      - name: Save ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: my-os-amd64
          path: |
            build/live-image-amd64.hybrid.iso
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
